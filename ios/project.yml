name: Cove
packages:
  Highlighter:
    url: https://github.com/smittytone/HighlighterSwift.git
    exactVersion: 3.1.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
  swift-cmark:
    url: https://github.com/swiftlang/swift-cmark.git
    exactVersion: 0.5.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CURRENT_PROJECT_VERSION: 82
    MARKETING_VERSION: 0.1.0
targets:
  Cove:
    type: application
    platform: iOS
    sources:
      - path: Cove
      - path: ../docs/THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: MarkdownUI
      - package: Highlighter
      - package: swift-cmark
        product: cmark-gfm
      - package: swift-cmark
        product: cmark-gfm-extensions
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cove
        INFOPLIST_FILE: Cove/Info.plist
        CODE_SIGN_ENTITLEMENTS: Cove/Cove.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Cove/Cove-Local.entitlements
    scheme:
      gatherCoverageData: false
      testTargets:
        - CoveUITests
        - CoveTests
  CoveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoveTests
    dependencies:
      - target: Cove
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cove.tests
  CoveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoveUITests
    dependencies:
      - target: Cove
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.cove.uitests
        TEST_TARGET_NAME: Cove
